name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint, build, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: digitemplate_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/digitemplate_test?schema=public
      JWT_ACCESS_SECRET: test-access-secret-000000000000000000
      JWT_REFRESH_SECRET: test-refresh-secret-00000000000000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install (workspaces)
        run: npm install --no-audit --no-fund
      - name: Prisma generate
        run: npm run prisma:generate
      - name: Lint API
        run: npm run lint:api
      - name: Test API
        run: npm run test
      - name: Build API
        run: npm run build:api

  web:
    name: Web — typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install (workspaces)
        run: npm install --no-audit --no-fund
      - name: Prisma generate (types shared)
        run: npm run prisma:generate
      - name: Typecheck Web
        run: npm --workspace @digitemplate/web run typecheck
      - name: Build Web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
        run: npm run build:web
